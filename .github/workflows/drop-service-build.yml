name: Drop Service build

on:
  push:
    branches: [main]
    paths:
      - 'drop-service/**'
      - '.github/workflows/drop-service-build.yml'
  pull_request:
    paths:
      - 'drop-service/**'
      - '.github/workflows/drop-service-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drop-service
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://nczdadkyysrxxcsnsrrn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fTm-7olaGmH1jqpkE7xXng_eaaiRoKE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: drop-service/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
